name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck deploy/*.sh

  image:
    runs-on: ubuntu-latest
    needs: [go, web, shell]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: guardian
          platforms: linux/amd64
          push: false
          tags: mihomo-stack:ci
          load: true
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mihomo-stack:ci
          format: json
          output: trivy-results.json
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Enforce vulnerability policy
        shell: bash
        run: |
          set -euo pipefail
          count="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)"
          if [ "$count" -eq 0 ]; then
            echo "No fixed HIGH or CRITICAL vulnerabilities found."
            exit 0
          fi

          echo "### Trivy found ${count} fixed HIGH/CRITICAL vulnerabilities" >> "$GITHUB_STEP_SUMMARY"
          jq -r '
            [.Results[]? as $result | $result.Vulnerabilities[]? |
              [$result.Target, .VulnerabilityID, .PkgName, .InstalledVersion, .FixedVersion, .Severity]
            ][0:50][] | @tsv
          ' trivy-results.json | while IFS=$'\t' read -r target vulnerability package installed fixed severity; do
            printf '::error title=Trivy %s %s::Package %s %s in %s; fixed in %s\n' \
              "$severity" "$vulnerability" "$package" "$installed" "$target" "$fixed"
          done
          exit 1
